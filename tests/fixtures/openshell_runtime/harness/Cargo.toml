[package]
name = "dotfiles-ai-openshell-child-seccomp-proof"
version = "0.1.7+dotfiles-ai.child-unix-deny.1"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[workspace]
resolver = "2"

[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
libc = "=0.2.189"
rustix = { version = "=1.1.4", features = ["net"] }
socket2 = { version = "=0.6.3", features = ["all"] }

[profile.release]
debug = 0
incremental = false
lto = false
