version: 1
filesystem_policy:
  include_workdir: false
  read_only:
    - /usr
    - /bin
    - /lib
    - /etc
    - /proc
    - /dev/urandom
  read_write:
    - /work
    - /scratch
landlock:
  compatibility: hard_requirement
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies: {}
# This is the denied-network generation. An allowed synthetic-network probe
# requires its own reviewed exact endpoint/binary rule and generation identity.
# A separate read-only bind mount protects /work/.git; Landlock's
# writable-parent rule alone is not claimed to protect that child.
