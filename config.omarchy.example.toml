# Native Omarchy AI workbench. Credentials and runtime state stay out of Git.
sourceDir = "/home/you/Projects/dotfiles-ai"
persistentState = "/home/you/.config/dotfiles-ai/chezmoi.boltdb"

[data.dotfiles_ai.state]
root = "/var/lib/dotfiles-ai/you"

[data.dotfiles_ai.linux_workstation]
enabled = true

# New worktrees use this home-filesystem root. The setup command creates it
# and ~/.cache/dotfiles-ai/dvc when they are missing. Any other first apply
# needs both to exist: a declared root must exist to render. An explicit apply
# then initializes the activation once and never replaces an existing one.
[data.dotfiles_ai.workspaces]
schema_version = 1
root = "~/.local/state/worktrees"

# Optional security toolchain: pinned BlackArch strap + curated packages.
# Keep disabled until you want pacman to own the attack-surface toolchain.
[data.dotfiles_ai.blackarch]
enabled = false

[data.dotfiles_ai.herdr]
launchagent = false
host_enabled = false

[data.dotfiles_ai.sandbox]
enabled = false

[data.dotfiles_ai.remote_user_environment]
enabled = false
