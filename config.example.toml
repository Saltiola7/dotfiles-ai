# Copy to ~/.config/dotfiles-ai/chezmoi.toml and replace /Users/you.
# This file is chezmoi configuration, not an application secret store.
sourceDir = "/Users/you/.local/share/chezmoi-dotfiles-ai"
persistentState = "/Users/you/.config/dotfiles-ai/chezmoi.boltdb"

[data.dotfiles_ai.opencode]
bedrock_region = "us-west-2"
bedrock_profile = ""
default_model = "openai/gpt-5.6-sol"
small_model = "openai/gpt-5.6-terra"
lmstudio_base_url = "http://127.0.0.1:1234/v1"
theme = "catppuccin"

[data.dotfiles_ai.herdr]
theme = "catppuccin"
agent_panel_sort = "priority"
launchagent = true
executable = "/opt/homebrew/bin/herdr"

[data.dotfiles_ai.hermes]
# Hermes is the optional orchestration plane; authenticate this environment separately.
enabled = false
executable = "~/.local/bin/hermes"
profile = "system"
provider = "openai-codex"
backlog_roots = [
  "/Users/you/.local/share/chezmoi-dotfiles-ai",
  "/Users/you/.local/share/chezmoi",
]
project_profiles = false # true only for a personal multi-project catalog

[data.dotfiles_ai.atuin]
# Non-secret HTTPS service URL; login and encryption keys remain inside each VM.
sync_address = "https://api.atuin.sh"

[data.dotfiles_ai.tailscale]
# Enrollment keys and private tailnet identity never belong in this file.
enabled = false
ssh = false

[data.dotfiles_ai.rnd]
# Keep false on machines that should not schedule autonomous review workers.
enabled = false
backend = "native" # switch to "hermes" only after the controlled cutover smoke
review_workdir = "/Users/you/.local/share/chezmoi-dotfiles-ai"
review_hour = 9
review_minute = 0
watchdog_interval_seconds = 300
# Herdr holds one managed workspace with a fresh OpenCode tab per scheduled run.
workspace_label = "DBSCTR R&D"
# Non-secret gh account name used for this source's draft pull requests.
github_account = "your-account"
github_repository = "your-account/dotfiles-ai"

[data.dotfiles_ai.onepassword]
# Enable only when `op` is installed and the account-specific values are set.
enabled = false
account = ""
user_uuid = ""
keychain_service = "op-service-account-token"

[data.dotfiles_ai.sandbox]
# Lima disks are sparse maximums; host allocation grows with actual guest use.
enabled = false
build_workspace = "workspace1"
cpus = 4
memory_gib = 8
disk_gib = 60

[[data.dotfiles_ai.sandbox.workspaces]]
name = "workspace1"
instance = "workspace1-sandbox"
shell_alias = "workspace1sh"
federate = true

[[data.dotfiles_ai.sandbox.workspaces.mounts]]
host = "/Users/you/projects"
guest = "/workspace/projects"
writable = true
protect_git_submodules = false
reference_name = ""
reference_description = ""
reference_subpath = ""

[[data.dotfiles_ai.sandbox.workspaces]]
name = "workspace2"
instance = "workspace2-sandbox"
shell_alias = "workspace2sh"
federate = true

[[data.dotfiles_ai.sandbox.workspaces.mounts]]
host = "/Users/you/reference"
guest = "/workspace/reference"
writable = true
protect_git_submodules = true
reference_name = "project-reference"
reference_description = "Optional architecture and implementation reference."
reference_subpath = ""
