# Copy to ~/.config/dotfiles-ai/chezmoi.toml and replace /Users/you.
# This file is chezmoi configuration, not an application secret store.
sourceDir = "/Users/you/.local/share/chezmoi-dotfiles-ai"
persistentState = "/Users/you/.config/dotfiles-ai/chezmoi.boltdb"

# [data.dotfiles_ai.state]
# root = "/Volumes/your-drive/state"

[data.dotfiles_ai.opencode]
# Vertex Claude stays off until vertex_project is set. Authenticate each
# environment separately with an isolated ADC file; never commit these values.
# Bootstrap once by hand, because the helper below only deploys after
# vertex_project is set:
#   CLOUDSDK_CONFIG=~/.config/dotfiles-ai/gcloud-vertex \
#     gcloud auth application-default login
#   CLOUDSDK_CONFIG=~/.config/dotfiles-ai/gcloud-vertex \
#     gcloud auth application-default set-quota-project PROJECT_ID
# Afterwards run `vertex-reauth`; user credentials under an organisation
# session-control policy expire and must be renewed interactively.
vertex_project = ""
vertex_location = "global"
# Canonical application_default_credentials.json file; it outranks ambient credentials.
# Its parent directory is the isolated CLOUDSDK_CONFIG that vertex-reauth targets.
vertex_credentials = ""
# Pins the browser login to one identity, so a multi-account picker cannot
# quietly authenticate the wrong one. Optional; blank prompts for a choice.
vertex_account = ""
default_model = "openai/gpt-5.6-sol"
small_model = "openai/gpt-5.6-luna"
lmstudio_base_url = "http://127.0.0.1:1234/v1"
theme = "catppuccin"

[data.dotfiles_ai.herdr]
theme = "catppuccin"
agent_panel_sort = "priority"
launchagent = true
executable = "/opt/homebrew/bin/herdr"

[data.dotfiles_ai.hermes]
# Hermes is the optional orchestration plane; authenticate this environment separately.
enabled = false
executable = "~/.local/bin/hermes"
profile = "system"
provider = "openai-codex"
backlog_roots = [
  "/Users/you/.local/share/chezmoi-dotfiles-ai",
  "/Users/you/.local/share/chezmoi",
]
project_profiles = false # true only for a personal multi-project catalog

[data.dotfiles_ai.atuin]
# Non-secret HTTPS service URL; login and encryption keys remain inside each VM.
sync_address = "https://api.atuin.sh"
server_enabled = false # generated true only inside the selected server workspace

[data.dotfiles_ai.tailscale]
# Enrollment keys and private tailnet identity never belong in this file.
enabled = false
ssh = false

[data.dotfiles_ai.rnd]
# Keep false on machines that should not schedule autonomous review workers.
enabled = false
backend = "native" # switch to "hermes" only after the controlled cutover smoke
review_workdir = "/Users/you/.local/share/chezmoi-dotfiles-ai"
review_hour = 9
review_minute = 0
watchdog_interval_seconds = 300
# Herdr holds one managed workspace with a fresh OpenCode tab per scheduled run.
workspace_label = "DBSCTR R&D"
# Non-secret gh account name used for this source's draft pull requests.
github_account = "your-account"
github_repository = "your-account/dotfiles-ai"

[data.dotfiles_ai.onepassword]
# Enable only when `op` is installed and the account-specific values are set.
# Managed Lima shells then receive this Keychain-backed service token in memory;
# the token is never rendered, persisted in a guest, or mapped into containers.
enabled = false
account = ""
user_uuid = ""
keychain_service = "op-service-account-token"

[data.dotfiles_ai.pm_kernel]
# Optional PostgreSQL runs only in the selected Lima workspace. The 1Password
# reference and external backup path remain machine-local host configuration.
enabled = false
workspace = ""
postgres_enabled = false
postgres_image = ""
postgres_password_ref = ""
postgres_backup_dir = ""
jira_adapter = "fake"
jira_project = ""
jira_issue_types = []

[data.dotfiles_ai.knowledge_store]
# Optional host-local embedding service. Model and runtime artifacts remain
# machine-local and are installed only after exact digest verification.
enabled = false
model_root = "/Volumes/your-drive/lmstudio"
embedding_port = 11435
embedding_dimensions = 4096
embedding_context_tokens = 4096

[data.dotfiles_ai.sandbox]
# Lima disks are sparse maximums; host allocation grows with actual guest use.
# Every managed Fedora guest uses rootless Podman, pinned Docker Compose v2, and
# a guest-only `docker` compatibility shim. Colima remains a host fallback.
enabled = false
build_workspace = "workspace1"
atuin_workspace = "" # optional always-on workspace for rootless Atuin
# Optional machine-local Lima state root. Empty keeps Lima's native default.
lima_home = ""
cpus = 4
memory_gib = 8
disk_gib = 60

[[data.dotfiles_ai.sandbox.workspaces]]
name = "workspace1"
instance = "workspace1-sandbox"
shell_alias = "workspace1sh"
federate = true

[[data.dotfiles_ai.sandbox.workspaces.mounts]]
host = "/Users/you/projects"
guest = "/workspace/projects"
writable = true
protect_git_submodules = false
reference_name = ""
reference_description = ""
reference_subpath = ""

[[data.dotfiles_ai.sandbox.workspaces]]
name = "workspace2"
instance = "workspace2-sandbox"
shell_alias = "workspace2sh"
federate = true

[[data.dotfiles_ai.sandbox.workspaces.mounts]]
host = "/Users/you/reference"
guest = "/workspace/reference"
writable = true
protect_git_submodules = true
reference_name = "project-reference"
reference_description = "Optional architecture and implementation reference."
reference_subpath = ""
