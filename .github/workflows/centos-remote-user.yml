name: centos-remote-user

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".chezmoidata.toml"
      - ".chezmoiignore"
      - "config.remote-user.example.toml"
      - "dot_local/bin/executable_codex-install.tmpl"
      - "dot_local/bin/executable_opencode*"
      - "dot_local/bin/executable_remote-agent-readiness.tmpl"
      - "dot_local/bin/executable_remote-user-bootstrap"
      - "dot_local/bin/executable_remote-user-foundation"
      - "dot_local/bin/executable_vertex-reauth.tmpl"
      - "run_onchange_after_install-*.sh.tmpl"
      - "tests/remote_user_environment_smoke.sh"

jobs:
  smoke:
    runs-on: ubuntu-latest
    container: quay.io/centos/centos:stream10
    steps:
      - uses: actions/checkout@v4
      - run: dnf -y install ca-certificates curl git gzip python3 tar unzip findutils
      - name: Run smoke
        run: |
          source=/home/you/.local/share/chezmoi-dotfiles-ai
          install -d -m 0700 /home/you
          install -d -m 0755 "$source"
          tar --exclude=.git -cf - . | tar -xf - -C "$source"
          cd "$source"
          git init -q
          git config user.name CI
          git config user.email ci@example.invalid
          git add -A
          git commit -q -m baseline
          git remote add origin https://github.com/Saltiola7/dotfiles-ai.git
          tests/remote_user_environment_smoke.sh
