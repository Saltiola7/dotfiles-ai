name: DBSCTR integration

on:
  workflow_dispatch:
    inputs:
      request:
        description: Bounded public-safe source request; empty means wake existing admitted work.
        required: false
        default: ''
        type: string
  workflow_run:
    workflows: [test, CodeQL, Semgrep]
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  actions: read
  pull-requests: read
  checks: read
  security-events: read

concurrency:
  group: dbsctr-integration-${{ github.repository }}
  cancel-in-progress: false

jobs:
  coordinate:
    name: coordinate
    if: >-
      ${{ vars.DBSCTR_COORDINATOR_ENABLED == 'true' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: dbsctr-integration
    steps:
      - name: Read the trusted caller generation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # Disabled source bootstrap only. Rollout replaces this with the identical
      # public action at its verified full merged SHA before enabling. Live host
      # validation refuses an absent/unmatched native shared implementation ref.
      - name: Advance the durable target
        uses: ./.github/actions/integration-coordinator
        with:
          policy-path: .github/dbsctr-integration.json
          token: ${{ secrets.DBSCTR_COORDINATOR_TOKEN }}
