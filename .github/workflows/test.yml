name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: brew install chezmoi worktrunk
      - run: bun install --global opencode-ai@1.18.35
      - name: Check publication and instruction contracts
        run: >-
          uv run --group test pytest
          tests/test_portable_distribution.py::test_public_tree_has_no_maintainer_identifiers
          tests/test_opencode_control_plane.py
          tests/test_dbsctr_lifecycle.py -q
      - run: uv run --group test pytest
