name: test

on:
  push:
    branches: [main]
  pull_request:

  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-shard:
    name: Full suite (${{ matrix.python-version }}, partition ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    # ponytail: partitions measured 85-87 min on the retired macOS runners
    # (PR #321); Linux hosted runners complete the same collection
    # materially faster, and the generous bound keeps growth headroom
    # without hiding a hung run.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        # Every lane retains the complete collection across four partitions.
        python-version: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["3.12", "3.13", "3.14", "3.15"]' || '["3.14"]') }}
        worktrunk-version: ["0.81.0"]
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "26.12.1"
          package-manager-cache: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true
          cache-python: true
      - name: Install selected Python with retry
        env:
          EXPECTED_PYTHON: ${{ matrix.python-version }}
        run: |
          set -euo pipefail
          attempt=1
          while ! uv python install "$EXPECTED_PYTHON"; do
            if [ "$attempt" -ge 3 ]; then
              echo "Python tool fetch failed after $attempt attempts" >&2
              exit 1
            fi
            echo "Python tool fetch attempt $attempt failed; retrying after backoff" >&2
            attempt=$((attempt + 1))
            sleep $((attempt * 10))
          done
      - name: Verify selected Python runtime
        env:
          EXPECTED_PYTHON: ${{ matrix.python-version }}
        run: |
          uv run --frozen --python "$EXPECTED_PYTHON" --group test python -I -B - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import sysconfig

          expected = os.environ["EXPECTED_PYTHON"]
          observed = ".".join(map(str, sys.version_info[:2]))
          child = json.loads(subprocess.check_output([
              "python3", "-I", "-B", "-c",
              "import json, sys; print(json.dumps(list(sys.version_info[:3])))",
          ], text=True))
          child_minor = ".".join(map(str, child[:2]))
          if observed != expected or child_minor != expected:
              raise SystemExit(f"Python runtime mismatch: requested={expected}, root={observed}, python3={child_minor}")
          if (sys.implementation.name != "cpython" or sysconfig.get_config_var("Py_GIL_DISABLED")
                  or sys.version_info.releaselevel != "final"):
              raise SystemExit("Qualification requires standard stable CPython")
          print(json.dumps({
              "requested": expected,
              "python": ".".join(map(str, sys.version_info[:3])),
              "python3": ".".join(map(str, child)),
              "lock_sha256": hashlib.sha256(Path("uv.lock").read_bytes()).hexdigest(),
          }, sort_keys=True))
          PY
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install pinned chezmoi
        run: |
          set -euo pipefail
          version=2.74.1
          sha256=ae01c66b1a6dbf563667c63fbbd9986b3cfa3c98dd266ddee732f63e8af2e9d1
          install_dir="$RUNNER_TEMP/chezmoi-$version"
          mkdir -p "$install_dir"
          curl --fail --location --silent --show-error --retry 3 --proto '=https' --tlsv1.2 \
            "https://github.com/twpayne/chezmoi/releases/download/v$version/chezmoi_${version}_linux_amd64.tar.gz" \
            --output "$RUNNER_TEMP/chezmoi.tar.gz"
          echo "$sha256  $RUNNER_TEMP/chezmoi.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/chezmoi.tar.gz" -C "$install_dir"
          "$install_dir/chezmoi" --version | grep -q "chezmoi version v$version"
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Install qualified Worktrunk
        shell: bash
        env:
          WORKTRUNK_VERSION: ${{ matrix.worktrunk-version }}
        run: |
          set -euo pipefail
          case "$WORKTRUNK_VERSION:$(uname -m)" in
            0.81.0:x86_64)
              target=x86_64-unknown-linux-musl
              sha256=0c253f216985ce9cd7b202a11606b5ce6aa934b1019fd1fbb9b7ce2b47b1c74a
              ;;
            0.81.0:aarch64)
              target=aarch64-unknown-linux-musl
              sha256=7a334d2e64c577afd0247e2411eff673360ab1f18897564f2d2e5d5374fbd74b
              ;;
            *) echo "Unsupported Worktrunk CI architecture" >&2; exit 1 ;;
          esac
          install_dir="$RUNNER_TEMP/worktrunk-$WORKTRUNK_VERSION"
          mkdir -p "$install_dir"
          archive="$install_dir/worktrunk.tar.xz"
          curl --fail --location --silent --show-error --retry 3 --proto '=https' --tlsv1.2 \
            "https://github.com/max-sixty/worktrunk/releases/download/v$WORKTRUNK_VERSION/worktrunk-$target.tar.xz" \
            --output "$archive"
          echo "$sha256  $archive" | sha256sum --check
          tar -xJf "$archive" -C "$install_dir" --strip-components=1
          test "$("$install_dir/wt" --version)" = "wt v$WORKTRUNK_VERSION"
          echo "$install_dir" >> "$GITHUB_PATH"
      - run: bun install --global opencode-ai@1.19.4
      - name: Provision evidence isolation on the test runner
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap libseccomp2
          /usr/bin/bwrap --version
          probe() {
            /usr/bin/bwrap --unshare-user --disable-userns --unshare-pid \
              --unshare-net --unshare-ipc --die-with-parent --cap-drop ALL \
              --ro-bind / / --proc /proc --dev /dev -- /bin/true
          }
          if ! probe; then
            # Use Ubuntu's confined profile on this ephemeral runner only.
            sudo apt-get install --no-install-recommends -y apparmor-profiles apparmor-utils
            profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
            test -f "$profile"
            sudo apparmor_parser --add "$profile"
            probe
          fi
      - name: Check publication and instruction contracts
        run: >-
          uv run --frozen --python "${{ matrix.python-version }}" --group test pytest
          tests/test_portable_distribution.py::test_public_tree_has_no_maintainer_identifiers
          tests/test_opencode_control_plane.py
          tests/test_dbsctr_lifecycle.py
          tests/test_dbsctrctl.py::DbsctrctlTest::test_evidence_descendants_cannot_write_original_paths
          tests/test_dbsctrctl.py::DbsctrctlTest::test_formatter_cannot_pass_by_rewriting_the_validation_candidate
          -q
      - name: Check full-suite partition
        env:
          CI_PYTHON_VERSION: ${{ matrix.python-version }}
          CI_WORKTRUNK_VERSION: ${{ matrix.worktrunk-version }}
          CI_SHARD: ${{ matrix.shard }}
          PYTEST_ADDOPTS: ""
          PYTEST_PLUGINS: ""
        # Installed-tool capability tests skip unless the opt-in names the pinned
        # OpenCode installed in this job, so a skip can never weaken this check.
        run: >-
          DBSCTR_OPENCODE_NATIVE_TEST_EXECUTABLE="$(bun pm bin -g)/opencode"
          uv run --frozen --python "${{ matrix.python-version }}" --group test python tests/ci_shard.py run
          --shard "$CI_SHARD" --python-version "$CI_PYTHON_VERSION"
          --worktrunk-version "$CI_WORKTRUNK_VERSION"
          --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
          --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
          --output ci-results
      - name: Retain partition evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-${{ matrix.python-version }}-${{ matrix.worktrunk-version }}-${{ matrix.shard }}
          path: ci-results/
          if-no-files-found: error
          retention-days: 7

  test:
    name: test (${{ matrix.python-version }})
    needs: test-shard
    if: ${{ always() }}
    # Verification reconciles partition evidence; workers execute natively on Linux.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["3.12", "3.13", "3.14", "3.15"]' || '["3.14"]') }}
        worktrunk-version: ["0.81.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true
          cache-python: true
      - name: Install selected Python with retry
        env:
          EXPECTED_PYTHON: ${{ matrix.python-version }}
        run: |
          set -euo pipefail
          attempt=1
          while ! uv python install "$EXPECTED_PYTHON"; do
            if [ "$attempt" -ge 3 ]; then
              echo "Python tool fetch failed after $attempt attempts" >&2
              exit 1
            fi
            echo "Python tool fetch attempt $attempt failed; retrying after backoff" >&2
            attempt=$((attempt + 1))
            sleep $((attempt * 10))
          done
      - name: Qualify portable artifact verifier
        run: uv run --frozen --group test pytest tests/test_ci_shard.py -q
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: pytest-${{ matrix.python-version }}-${{ matrix.worktrunk-version }}-*
          path: ci-results
      - name: Verify complete lane coverage
        env:
          CI_PYTHON_VERSION: ${{ matrix.python-version }}
          CI_WORKTRUNK_VERSION: ${{ matrix.worktrunk-version }}
          CI_WORKERS_RESULT: ${{ needs.test-shard.result }}
        run: >-
          uv run --frozen --python "${{ matrix.python-version }}" --group test python tests/ci_shard.py verify
          --python-version "$CI_PYTHON_VERSION"
          --worktrunk-version "$CI_WORKTRUNK_VERSION"
          --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
          --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
          --workers-result "$CI_WORKERS_RESULT" --output ci-results
