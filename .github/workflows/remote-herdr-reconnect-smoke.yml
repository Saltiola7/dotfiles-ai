name: remote-herdr-reconnect-smoke

on:
  # Isolated diagnostic only; not a PR or default-branch check.
  push:
    branches: [qual/rrw-007k-reconnect-scale]

permissions:
  contents: read

jobs:
  advisory-reconnect-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        observation: [sampled, passive]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check fixture source boundaries
        run: |
          python3 -m unittest discover -s tests -p test_remote_herdr_qualification.py
          python3 -m unittest discover -s tests -p test_remote_herdr_kept_probe.py
      - name: Measure disposable 50-client reconnect
        shell: bash
        env:
          OBSERVATION: ${{ matrix.observation }}
        run: |
          set -euo pipefail
          [[ $(uname -m) == x86_64 ]] || { echo 'F07-SMOKE: wrong-architecture'; exit 1; }
          [[ $OBSERVATION == sampled || $OBSERVATION == passive ]]
          image="f07-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          container="$image-$OBSERVATION"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          started=$SECONDS
          docker build --pull -f tests/remote_herdr_systemd/Containerfile -t "$image" . \
            >/dev/null 2>&1 || { echo 'F07-SMOKE: image-build-failed'; exit 1; }
          echo "F07-SMOKE: image-built seconds=$((SECONDS - started))"
          docker run -d --name "$container" --privileged --cgroupns=private \
            --tmpfs /run --tmpfs /run/lock --stop-timeout 40 \
            "$image" /bin/bash -ec 'mount -o remount,rw /sys/fs/cgroup; exec /sbin/init' \
            >/dev/null 2>&1 || { echo 'F07-SMOKE: container-boot-failed'; exit 1; }
          status=0
          docker exec "$container" bash /opt/f07/boot-smoke.sh "reconnect-$OBSERVATION" 2>&1 \
            | grep --line-buffered -E '^F07-SMOKE: (installed|baseline-exact-50|backend-ready|progress-unavailable|(progress-|final-)?exact-[0-9]+-connected-[0-9]+|unit-(success|exit-code|timeout|signal|resources|other)|intent-(none|stop|launch|verify|unknown)|restore-refused-intent-(none|stop|launch|verify|unknown)-boundary-(unit-owner|passed|unclassified)|passed) seconds=[0-9]+\.[0-9]+$|^F07: (failed-[a-z0-9-]+|shell-invariant-failed-[a-z0-9-]+|stage-complete|opencode v2\.[0-9]+\.[0-9]+; binary-sha256=[a-f0-9]{64})$' \
            || status=$?
          echo "F07-SMOKE: elapsed seconds=$((SECONDS - started))"
          exit "$status"
