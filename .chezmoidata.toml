[dotfiles_ai.distribution]
repository = "https://github.com/Saltiola7/dotfiles-ai.git"

[dotfiles_ai.state]
root = ""

# An absent workspaces table selects ~/Worktrees and ~/.cache/dotfiles-ai/dvc.
# Do not merge a schema_version default into an explicit unversioned local table.
# Configure [data.dotfiles_ai.workspaces] in private chezmoi TOML; activation is separate.

[dotfiles_ai.history_projection]
enabled = false
refresh_hour = 4
refresh_minute = 30
refresh_timeout_seconds = 3600

[dotfiles_ai.headless_server]
enabled = false

[dotfiles_ai.codex]
channel = "stable"

[dotfiles_ai.prefect_mcp]
enabled = false
profiles_path = ""
profile = ""
api_url = ""
api_auth_string_env = ""
api_key_env = ""

[dotfiles_ai.cline_desktop]
enabled = false

[dotfiles_ai.cline_cli]
enabled = false

[dotfiles_ai.cline_vertex]
enabled = false
model = "claude-sonnet-5-5@default"
hub_port = 25464

[dotfiles_ai.opencode]
version = "1.18.25"
linux_amd64_asset_url = "https://github.com/anomalyco/opencode/releases/download/v1.18.25/opencode-linux-x64.tar.gz"
linux_amd64_asset_sha256 = "58a3729a6f3432dd6d2917fcc4a949788891a035818646ad480e12c947f56e78"
vertex_project = ""
vertex_location = "global"
vertex_credentials = ""
vertex_account = ""
default_model = "openai/gpt-6-astra"
small_model = "openai/gpt-6-luna"
lmstudio_base_url = "http://127.0.0.1:1234/v1"
theme = "catppuccin"

[dotfiles_ai.herdr]
theme = "catppuccin"
agent_panel_sort = "priority"
launchagent = true
host_enabled = false
signing_identity_sha256 = ""
state_volume_uuid = ""
probe_interval_seconds = 30
health_max_age_seconds = 90
executable = "~/.local/bin/herdr"
version = "0.9.5"
protocol = 22
asset_url = "https://github.com/herdrdev/herdr/releases/download/v0.9.5/herdr-macos-aarch64"
asset_sha256 = "fb77c2232a05a8035421382c894392f4174e4e38a18e48af3dd0290157c3a7e2"
linux_amd64_asset_url = "https://github.com/herdrdev/herdr/releases/download/v0.9.5/herdr-linux-x86_64"
linux_amd64_asset_sha256 = "14d9e8bc8b4a9e0118d77c32266f76d461f09b40342eb23752960bd89f59929d"

[dotfiles_ai.hermes]
enabled = false
executable = "~/.local/bin/hermes"
profile = "system"
provider = "openai-codex"
backlog_roots = []
project_profiles = false

[dotfiles_ai.atuin]
sync_address = "https://api.atuin.sh"
server_enabled = false

[dotfiles_ai.tailscale]
enabled = false
ssh = false

[dotfiles_ai.remote_workspace]
enabled = false
repository = ""
project = ""
zone = ""
instance = ""
account = ""
tailscale_host = ""

# Native Linux desktop, independent of the CentOS remote-user profile.
[dotfiles_ai.linux_workstation]
enabled = false

[dotfiles_ai.remote_user_environment]
enabled = false

[dotfiles_ai.rnd]
enabled = false
backend = "native"
runtime = "opencode"
review_workdir = ""
review_hour = 9
review_minute = 0
watchdog_interval_seconds = 300
workspace_label = "DBSCTR R&D"
github_account = ""
github_repository = ""

[dotfiles_ai.onepassword]
enabled = false
account = ""
user_uuid = ""
keychain_service = "op-service-account-token"

[dotfiles_ai.pm_kernel]
enabled = false
workspace = ""
postgres_enabled = false
postgres_image = ""
postgres_password_ref = ""
postgres_backup_dir = ""
jira_adapter = "fake"
jira_project = ""
jira_issue_types = []

[dotfiles_ai.knowledge_store]
enabled = false
model_root = ""
quality_model_root = ""
quality_benchmark_source_revision = ""
quality_benchmark_query_approval_commit = ""
quality_benchmark_judgment_freeze_commit = ""
quality_benchmark_query_digest = ""
quality_benchmark_protocol_digest = ""
quality_benchmark_judgment_digest = ""
embedding_port = 11435
embedding_dimensions = 4096
embedding_context_tokens = 4096
quality_services_enabled = false
code_embedding_port = 11436
reranker_port = 11437
postgres_enabled = false
reconcile_enabled = false
reconcile_interval_seconds = 900
reconcile_timeout_seconds = 21600

[dotfiles_ai.knowledge_store.projects]

[dotfiles_ai.sandbox]
enabled = false
build_workspace = ""
atuin_workspace = ""
lima_home = ""
workspaces = []
cpus = 4
memory_gib = 8
disk_gib = 60
