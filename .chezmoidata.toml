[dotfiles_ai.distribution]
repository = "https://github.com/Saltiola7/dotfiles-ai.git"

[dotfiles_ai.state]
root = ""

[dotfiles_ai.opencode]
vertex_project = ""
vertex_location = "global"
vertex_credentials = ""
vertex_account = ""
default_model = "openai/gpt-5.6-sol"
small_model = "openai/gpt-5.6-terra"
lmstudio_base_url = "http://127.0.0.1:1234/v1"
theme = "catppuccin"

[dotfiles_ai.herdr]
theme = "catppuccin"
agent_panel_sort = "priority"
launchagent = true
executable = "/opt/homebrew/bin/herdr"

[dotfiles_ai.hermes]
enabled = false
executable = "~/.local/bin/hermes"
profile = "system"
provider = "openai-codex"
backlog_roots = []
project_profiles = false

[dotfiles_ai.atuin]
sync_address = "https://api.atuin.sh"

[dotfiles_ai.tailscale]
enabled = false
ssh = false

[dotfiles_ai.rnd]
enabled = false
backend = "native"
review_workdir = ""
review_hour = 9
review_minute = 0
watchdog_interval_seconds = 300
workspace_label = "DBSCTR R&D"
github_account = ""
github_repository = ""

[dotfiles_ai.onepassword]
enabled = false
account = ""
user_uuid = ""
keychain_service = "op-service-account-token"

[dotfiles_ai.sandbox]
enabled = false
build_workspace = ""
workspaces = []
cpus = 4
memory_gib = 8
disk_gib = 60
