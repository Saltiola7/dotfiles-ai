# Copy to ~/.config/dotfiles-ai/chezmoi.toml and replace /home/you.
# Credentials, tokens, provider sessions, and encryption keys do not belong here.
sourceDir = "/home/you/.local/share/chezmoi-dotfiles-ai"
persistentState = "/home/you/.local/state/dotfiles-ai/chezmoi.boltdb"

[data.dotfiles_ai.remote_user_environment]
enabled = true

# Setup creates these user-owned roots before rendering; activation remains
# workflow-policy owned. Keep its repo-path-hash and branch sanitizing policy.
[data.dotfiles_ai.workspaces]
schema_version = 1
root = "/home/you/.local/state/worktrees"

[data.dotfiles_ai.onepassword]
enabled = false

[data.dotfiles_ai.prefect_mcp]
# Enabling installs pinned user-local uv; host setup must first provide Python 3.13.
# Runtime installation retains its frozen lock and --no-python-downloads policy.
enabled = false

[data.dotfiles_ai.jfrog_cli]
enabled = false

[data.dotfiles_ai.history_projection]
enabled = false

[data.dotfiles_ai.codex]
channel = "stable"

[data.dotfiles_ai.opencode]
# Set the non-secret project before starting the user-owned Vertex login.
vertex_project = ""
vertex_location = "global"
vertex_account = ""

[data.dotfiles_ai.herdr]
launchagent = false
host_enabled = false

[data.dotfiles_ai.atuin]
# Remote history stays local; the role ignores any inherited sync endpoint.
sync_address = ""
server_enabled = false

[data.dotfiles_ai.hermes]
enabled = false

[data.dotfiles_ai.rnd]
enabled = false

[data.dotfiles_ai.pm_kernel]
enabled = false
postgres_enabled = false

[data.dotfiles_ai.knowledge_store]
enabled = false
quality_services_enabled = false
postgres_enabled = false
reconcile_enabled = false
